server.bind=
server.port=8267
server.path=/p1meter.php
server.token=
server.threads=4
server.maxBodyBytes=16384
server.logRequests=true

mqtt.enabled=true
mqtt.server=
mqtt.port=1883
mqtt.username=
mqtt.password=
mqtt.clientId=p1mqtt
mqtt.topicPrefix=p1meter
mqtt.discoveryPrefix=homeassistant
mqtt.qos=1
mqtt.retain=true
mqtt.retainState=false
mqtt.ssl=false
mqtt.keepAliveSeconds=60
mqtt.dryRun=false

ha.deviceName=P1 Meter
ha.deviceId=p1_meter
ha.deviceManufacturer=
ha.deviceModel=
ha.expireAfterSeconds=0
ha.energyScale=0.001
ha.includeDiagnosticSensors=true

publish.republishIntervalSeconds=60
publish.jsonState=true

log.level=INFO
